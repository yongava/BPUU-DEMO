<text x="56" y="1078" font-size="12" fill="#3D2A12">1)  [12] ลากจุด + ใต้กล่อง ไปวางบน [8] แล้วกดป้าย “Select Branch” บนเส้น เลือก Approve · ลากอีกเส้นไป [9] เลือก Deny  (ซูมออกให้เห็นทั้งสองกล่องก่อนลาก)</text>
<text x="56" y="1101" font-size="12" fill="#3D2A12">2)  สร้าง [13] Approval (ผู้อนุมัติ dev.codegym@gmail.com) → ลากเส้นจาก [2] ไป [13] แล้วเลือกสาขา “7. แจ้งปัญหาการใช้งานพื้นที่/ที่จอดรถ”</text>
<text x="56" y="1124" font-size="12" fill="#3D2A12">3)  สร้าง [14] Email (ถึง อีเมลผู้ยื่นคำขอ {input20}, เรื่อง “สรุปผลการแก้ไขปัญหา”) → ต่อ [13] Approve → [14] และ [13] Deny → [9]</text>
<text x="56" y="1147" font-size="12" fill="#3D2A12">4)  เปลี่ยนชื่อกล่องให้สื่อความ: [10] “Vehicle Registry Branch” · [12] “BPUU Staff ตรวจสอบทะเบียนรถ” (ตอนนี้เป็นชื่อ default)</text>
