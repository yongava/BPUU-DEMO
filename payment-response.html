<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPUU | แนบสลิปชำระเงิน</title>
    <meta name="theme-color" content="#111827">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background:
                radial-gradient(circle at top left, rgba(250, 70, 22, 0.12), transparent 30%),
                radial-gradient(circle at top right, rgba(255, 199, 44, 0.16), transparent 24%),
                linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            font-family: 'Sarabun', sans-serif;
            color: #111827;
        }
        .payment-shell {
            position: relative;
            isolation: isolate;
        }
        .payment-shell::before,
        .payment-shell::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(16px);
            z-index: -1;
            pointer-events: none;
        }
        .payment-shell::before {
            inset: -8% auto auto -8%;
            width: 260px;
            height: 260px;
            background: rgba(250, 70, 22, 0.08);
        }
        .payment-shell::after {
            inset: auto -10% -12% auto;
            width: 320px;
            height: 320px;
            background: rgba(123, 129, 137, 0.10);
        }
        .payment-hero {
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            padding: 28px;
            color: #fff;
            background: linear-gradient(135deg, #111827 0%, #1f2937 48%, #fa4616 135%);
            box-shadow: 0 26px 70px rgba(15, 23, 42, 0.22);
        }
        .payment-hero::after {
            content: "";
            position: absolute;
            right: -30px;
            top: -40px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
        }
        .payment-kicker {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
        }
        .payment-title {
            font-size: clamp(1.8rem, 3vw, 3rem);
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -0.03em;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.10);
            backdrop-filter: blur(12px);
            border-radius: 24px;
        }
        .ticket-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 0.85rem;
            border-radius: 999px;
            background: rgba(250, 70, 22, 0.08);
            color: #111827;
            font-weight: 700;
        }
        .qr-preview {
            max-width: 100%;
            border-radius: 18px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }
    </style>
</head>
<body>
<main class="payment-shell">
    <div class="container py-4 py-lg-5">
        <section class="payment-hero mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
                <div>
                    <div class="payment-kicker mb-2">BPUU Overnight Payment Response</div>
                    <h1 class="payment-title mb-3">แนบสลิปและข้อมูลออกใบเสร็จ</h1>
                    <p class="mb-0 text-white-75">
                        ระบบหน้านี้ใช้สำหรับยืนยันการชำระเงินของคำขอจอดรถค้างคืน
                    </p>
                </div>
                <a class="btn btn-light fw-bold" href="index.html">
                    <i class="bi bi-house-door-fill me-1"></i>กลับหน้าแรก
                </a>
            </div>
        </section>

        <div id="paymentApp" class="glass-card p-4 p-lg-5">
            <div class="text-center py-5">
                <div class="spinner-border text-warning mb-3" role="status"></div>
                <div class="fw-bold">กำลังโหลดข้อมูลคำขอ...</div>
            </div>
        </div>
    </div>
</main>

<script src="js/workflow-test-config.js"></script>
<script src="js/workflow-api.js"></script>
<script src="js/payment-response.js"></script>
</body>
</html>
