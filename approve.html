<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPUU Approval</title>
    <meta name="theme-color" content="#111827">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/approve.css?v=20260518-6">
</head>
<body>
<main class="approval-shell">
    <section class="approval-hero">
        <div class="approval-brand">
            <div class="approval-mark"><i class="bi bi-shield-check"></i></div>
            <div>
                <div class="approval-kicker">BPUU Workflow Approval</div>
                <h1>พิจารณาคำขอผ่านเว็บ</h1>
            </div>
        </div>
        <a class="approval-admin-link" href="admin.html">
            <i class="bi bi-speedometer2 me-1"></i>Admin
        </a>
    </section>

    <section class="approval-card" id="approvalRoot">
        <div class="approval-loading">
            <div class="spinner-border text-warning" role="status"></div>
            <div>กำลังโหลดรายละเอียดคำขอ...</div>
        </div>
    </section>
</main>

<div class="modal fade" id="paidApprovalModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content approval-modal-shell">
            <div class="modal-header approval-modal-header">
                <div>
                    <h5 class="modal-title fw-bold mb-1">อนุมัติแบบมีค่าใช้จ่าย</h5>
                    <div class="approval-modal-subtitle">ระบบจะข้าม BPUU Manager และส่ง QR พร้อมยอดชำระให้ผู้ขอทันที</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="paidApprovalForm">
                <div class="modal-body approval-modal-body">
                    <div class="approval-modal-summary" id="paidApprovalSummary"></div>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-ci-bluegrey" for="paidApprovalAmount">จำนวนเงิน (บาท) *</label>
                            <input type="number" min="0" step="0.01" class="form-control" id="paidApprovalAmount" placeholder="เช่น 120.00" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-ci-bluegrey" for="paidApprovalQr">ไฟล์ QR Code *</label>
                            <input type="file" class="form-control" id="paidApprovalQr" accept="image/*,.pdf" required>
                            <div class="form-text approval-modal-file-label" id="paidApprovalQrLabel">ยังไม่ได้เลือกไฟล์</div>
                        </div>
                    </div>
                    <div class="alert alert-warning border-0 mt-3 mb-0 approval-modal-note" role="alert">
                        เมื่อกดยืนยัน ระบบจะบันทึก QR Code, ยอดเงิน และเปลี่ยนสถานะเป็นรอชำระเงินทันที
                    </div>
                    <div id="paidApprovalFormMessage" class="mt-3"></div>
                </div>
                <div class="modal-footer approval-modal-footer">
                    <button type="button" class="btn btn-outline-secondary fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="submit" class="btn btn-ci-orange fw-bold" id="paidApprovalConfirmBtn">
                        <i class="bi bi-send-check me-1"></i>อนุมัติและส่ง QR
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/workflow-test-config.js?v=20260518-6"></script>
<script src="js/approval-link.js?v=20260518-6"></script>
<script src="js/workflow-api.js?v=20260518-6"></script>
<script src="js/approve.js?v=20260518-6"></script>
</body>
</html>
